name: Daily AI News

on:
  workflow_dispatch:

concurrency:
  group: daily-ai-news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install .

      - name: Run Python validation
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install '.[dev]'
          python -m pytest -q

      - name: Validate AI backend without sending
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL || '@cf/meta/llama-3.3-70b-instruct-fp8-fast' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: python scripts/validate_ai_backend.py

      - name: Build no-send preview
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/build_global_events_preview.py --output-dir validation-output

      - name: Set up Node for web validation
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate website
        if: github.event_name == 'workflow_dispatch'
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test

      - name: Upload no-send preview
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: global-ai-events-preview
          path: validation-output/
